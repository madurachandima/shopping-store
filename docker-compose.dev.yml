version: "3.8"
services:
  node-app:
    build: .  
    container_name: shopping_store
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules  
    ports:
      - "3000:3000"
    command: ["npm", "run", "start"]  
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_USER=user  # Change this to match MYSQL_USER
      - DB_PASSWORD=1234  # Match MYSQL_PASSWORD
      - DB_NAME=shopping_db
    depends_on:
      - mysql  

  mysql:
    image: mysql:8.0  
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # Keep this for root
      MYSQL_DATABASE: shopping_db
      MYSQL_USER: user  # Create a separate user
      MYSQL_PASSWORD: 1234  # Password for user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql  # Persist database data

volumes:
  mysql_data:
